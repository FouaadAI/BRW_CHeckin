<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BRW Check-in</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: #222;
    }

    main {
      max-width: 400px;
      margin: 2rem auto;
      padding: 1.5rem;
      background-color: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1, h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin: 1rem 0 0.25rem;
      font-weight: 600;
    }

    input, select, button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
    }

    button {
      margin-top: 1.5rem;
      background-color: #0055a4;
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    button:active {
      background-color: #003d7a;
    }

    .message {
      margin-top: 1rem;
      min-height: 1.5rem;
      text-align: center;
      font-weight: 500;
      color: #c00;
    }

    .message.success {
      color: #008000;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main>
    <section id="pin-screen">
      <h1>BRW Check-in</h1>
      <form id="pin-form">
        <label for="pin">6-stelliger PIN</label>
        <input
          id="pin"
          type="password"
          inputmode="numeric"
          pattern="\d{6}"
          maxlength="6"
          placeholder="000000"
          autocomplete="off"
          required
        >
        <button type="submit">Weiter</button>
      </form>
      <p id="pin-message" class="message" aria-live="polite"></p>
    </section>

    <section id="form-screen" hidden>
      <h2>Check-in</h2>
      <form id="checkin-form" novalidate>
        <label for="name">Name</label>
        <input
          id="name"
          list="name-list"
          type="text"
          placeholder="Mitarbeiter suchen"
          autocomplete="off"
          required
        >
        <datalist id="name-list"></datalist>

        <label for="station">Station</label>
        <input
          id="station"
          list="station-list"
          type="text"
          placeholder="Station suchen"
          autocomplete="off"
          required
        >
        <datalist id="station-list"></datalist>

        <label for="shift">Schicht</label>
        <select id="shift" required>
          <option value="" disabled selected>Schicht auswählen</option>
          <option value="Früh">Früh</option>
          <option value="Spät">Spät</option>
          <option value="Nacht">Nacht</option>
        </select>

        <button type="submit" id="submit-btn">Check-in senden</button>
      </form>
      <p id="form-message" class="message" aria-live="polite"></p>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
